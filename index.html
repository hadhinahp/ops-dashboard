<title>Executive Operations Summary</title>
<link rel="icon" href="data:,">
<style>
:root{--teal:#00879B;--teal-ink:#0B4F5C;--gold:#B08A2E;--ink:#1F2A30;--muted:#66737A;--line:#D5DEE1;--page:#F5F8F9;--err:#A61B1B;--err-bg:#FBE4E4}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:#fff;border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:8px;padding:28px 28px 22px;width:100%;max-width:380px;box-shadow:0 6px 24px rgba(11,79,92,.08)}
.logo{height:38px;width:auto;display:block;margin-bottom:16px;max-width:100%}
h1{font-size:19px;margin:0 0 4px;color:var(--teal-ink);font-weight:600}
p{margin:0 0 16px;color:var(--muted);font-size:13px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
input[type=password]{width:100%;height:40px;border:1px solid var(--line);border-radius:5px;padding:0 10px;font:inherit;font-size:15px}
input[type=password]:focus-visible,button:focus-visible,input[type=checkbox]:focus-visible{outline:2px solid var(--teal-ink);outline-offset:2px}
.remember{display:flex;gap:7px;align-items:center;margin:12px 0 16px;font-size:13px;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:400}
button{width:100%;height:40px;border:0;border-radius:5px;background:var(--teal-ink);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:#08414C}
button[disabled]{opacity:.65;cursor:progress}
.msg{margin-top:12px;font-size:13px;min-height:1.2em}
.msg.err{color:var(--err);background:var(--err-bg);border-radius:4px;padding:6px 9px}
.fine{margin-top:18px;border-top:1px solid var(--line);padding-top:10px;font-size:11.5px;color:var(--muted)}
noscript{display:block;margin-top:12px;color:var(--err)}
</style>
</head>

const KEY_STORE = "eos-unlock-" + P.salt.slice(0, 12);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const ub64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const msg = document.getElementById("msg"), go = document.getElementById("go"), pw = document.getElementById("pw");

function say(t, err){ msg.textContent = t; msg.className = "msg" + (err ? " err" : ""); }
if (!window.crypto || !crypto.subtle){ say("This browser can't decrypt the dashboard (it needs a secure https page and a current browser).", true); go.disabled = true; return; }

async function keyFromPassword(pass){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt:b64(P.salt), iterations:P.iter}, base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function decryptPage(key){
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, key, b64(P.data));
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close(); }
function store(key){ return crypto.subtle.exportKey("raw", key).then(raw => { try { sessionStorage.setItem(KEY_STORE, ub64(raw)); } catch (e) {} }); }

// Re-open without asking again in the same tab (key kept only for this tab's session)
(async () => {
  let saved = null; try { saved = sessionStorage.getItem(KEY_STORE); } catch (e) {}
  if (!saved) return;
  try { const key = await crypto.subtle.importKey("raw", b64(saved), {name:"AES-GCM"}, false, ["decrypt"]); show(await decryptPage(key)); }
  catch (e) { try { sessionStorage.removeItem(KEY_STORE); } catch (x) {} }
})();

document.getElementById("gate").addEventListener("submit", async ev => {
  ev.preventDefault();
  go.disabled = true; say("Checking…");
  try {
    const key = await keyFromPassword(pw.value);
    const html = await decryptPage(key);
    if (document.getElementById("remember").checked) await store(key);
    show(html);
  } catch (e) {
    go.disabled = false; pw.select(); say("That password isn't right. Please try again.", true);
  }
});
})();
</script>
